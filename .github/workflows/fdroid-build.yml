name: F-Droid release build

on:
  pull_request:
    paths:
      - '.github/workflows/fdroid-build.yml'
      - 'android-app/**'
      - 'fdroid/**'
      - 'fastlane/**'
      - 'NOTICE.md'
      - '*.html'
      - '*.js'
      - 'js/**'
      - 'lib/**'
      - 'groups/**'
      - 'patterns/**'
      - 'style/**'
      - 'visualizerFramework/**'
      - 'package.json'
      - 'tests/**'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Verify Group Explorer source
        run: |
          npm test
          grep -F "Pattern.html?groupURL=" GroupExplorer.html
          test -s CayleyDiagram.js
          test -s Multtable.js
          test -s js/GroupPattern.js
          grep -Fq "LGPL v3.0" README.md
          grep -Fq "Ray Ellis" NOTICE.md
          grep -Fq "Nathan Carter" NOTICE.md
          grep -Fq "The MIT License" lib/three-146/LICENSE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build inputs
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify F-Droid release output
        run: |
          apk=android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/group-explorer-release-files.txt"
          grep -Fxq assets/site/GroupExplorer.html "$RUNNER_TEMP/group-explorer-release-files.txt"
          grep -Fxq assets/site/CayleyDiagram.js "$RUNNER_TEMP/group-explorer-release-files.txt"
          grep -Fxq assets/site/Multtable.js "$RUNNER_TEMP/group-explorer-release-files.txt"
          grep -Fxq assets/site/Pattern.html "$RUNNER_TEMP/group-explorer-release-files.txt"
          grep -Fxq assets/site/js/GroupPattern.js "$RUNNER_TEMP/group-explorer-release-files.txt"
          grep -Fxq assets/site/NOTICE.md "$RUNNER_TEMP/group-explorer-release-files.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/group-explorer-release-badging.txt"
          grep -Fq "package: name='org.isomorphisms.groupexplorer' versionCode='1' versionName='0.1.0'" "$RUNNER_TEMP/group-explorer-release-badging.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: group-explorer-fdroid-unsigned
          path: android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
