name: Mobile first-paint APK

on:
  push:
    branches:
      - mobile-random-group-first-paint
  pull_request:
    branches:
      - scriptable-symmetry-patterns-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test and verify mobile entry point
        run: |
          npm test
          test -s Mobile.html
          test -s Mobile.js
          grep -F 'getGroupOrDownload(randomURL())' Mobile.js
          grep -F 'Mobile.html' android-app/app/src/main/java/org/isomorphisms/groupexplorer/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify bundled mobile app
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/site/Mobile.html"
          unzip -l "$APK" | grep -F "assets/site/Mobile.js"
          unzip -l "$APK" | grep -F "assets/site/groups/Z_5.group"
          cp "$APK" cayley-mobile-first-paint-debug.apk
          sha256sum cayley-mobile-first-paint-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cayley-mobile-first-paint-apk
          path: cayley-mobile-first-paint-debug.apk
          if-no-files-found: error
          retention-days: 30
