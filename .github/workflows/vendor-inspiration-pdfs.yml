name: Vendor redistributable inspiration PDFs

on:
  push:
    branches:
      - inspiration-pdfs
    paths:
      - .github/workflows/vendor-inspiration-pdfs.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/vendor-inspiration-pdfs.yml
      - inspiration/README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspiration-pdfs

      - name: Download attributed source PDFs
        shell: bash
        run: |
          set -u
          mkdir -p inspiration
          failures="$(mktemp)"

          fetch_pdf() {
            name="$1"
            url="$2"
            tmp="inspiration/.${name}.download"
            rm -f "$tmp"

            if ! curl --fail --location \
              --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 240 \
              "$url" --output "$tmp"; then
              printf '%s\t%s\n' "$name" "$url" >> "$failures"
              rm -f "$tmp"
              return 0
            fi

            if [ "$(head -c 5 "$tmp")" != '%PDF-' ]; then
              printf '%s\t%s\t%s\n' "$name" "$url" 'download was not a PDF' >> "$failures"
              rm -f "$tmp"
              return 0
            fi

            mv "$tmp" "inspiration/$name"
          }

          # Allen Hatcher's Algebraic Topology materials state that paper or
          # electronic copies for noncommercial use may be made freely without
          # explicit permission. The attribution/provenance note is in README.
          fetch_pdf \
            hatcher-spectral-sequences.pdf \
            https://pi.math.cornell.edu/~hatcher/AT/ATch5.pdf

          # MIT OpenCourseWare resources are distributed under CC BY-NC-SA 4.0
          # unless an individual resource says otherwise. Attribution and the
          # license are recorded in inspiration/README.md.
          fetch_pdf \
            kedlaya-homological-algebra.pdf \
            https://ocw.mit.edu/courses/18-726-algebraic-geometry-spring-2009/738060c0a52a5982c224dd62c3fd68c0_MIT18_726s09_lec16_homalg.pdf

          fetch_pdf \
            raskin-exact-sequences-and-tate-cohomology.pdf \
            https://ocw.mit.edu/courses/18-786-number-theory-ii-class-field-theory-spring-2016/71dea3b115b9de8fe6a0934847a613e9_MIT18_786S16_lec6.pdf

          fetch_pdf \
            andrews-juvitop-spectral-sequences.pdf \
            https://ocw.mit.edu/courses/18-906-algebraic-topology-ii-spring-2020/cd9f38f4cbc7f008d3299432df656d07_andrews-spectral-sequences.pdf

          if [ -s "$failures" ]; then
            cp "$failures" inspiration/download-failures.txt
          else
            rm -f inspiration/download-failures.txt
          fi

      - name: Commit source copies
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspiration
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Vendor attributed inspiration PDFs [skip ci]'
          git push origin HEAD:inspiration-pdfs
