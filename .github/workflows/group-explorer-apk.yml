name: Group Explorer APK

on:
  push:
    branches:
      - mobile-apk
  pull_request:
    branches:
      - mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR 1 based branch
        uses: actions/checkout@v4

      - name: Confirm PR 1 mobile source
        shell: bash
        run: |
          grep -F "style/mobile.css" index.html
          grep -F "window.matchMedia" visualizerFramework/visualizer.md
          npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android-app
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify bundled Group Explorer
        shell: bash
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/site/GroupExplorer.html"
          unzip -l "$APK" | grep -F "assets/site/style/mobile.css"
          unzip -l "$APK" | grep -F "assets/site/visualizerFramework/visualizer.md"
          cp "$APK" group-explorer-pr1-mobile-debug.apk
          sha256sum group-explorer-pr1-mobile-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: group-explorer-pr1-mobile-apk
          path: group-explorer-pr1-mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
